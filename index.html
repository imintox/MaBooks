<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#08060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MaBooks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>MaBooks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>MaBooks</h1>
      <div class="sub" id="stats"></div>
    </div>
    <button class="icon-btn" id="gear" aria-label="Backup and settings">⚙︎</button>
  </header>
  <div id="nudge"></div>
  <div class="seg">
    <button id="tab-read" class="on">Read<span class="n" id="n-read"></span></button>
    <button id="tab-want">Want to read<span class="n" id="n-want"></span></button>
  </div>
  <input class="search" id="q" type="search" placeholder="Search" autocomplete="off">
  <div class="list" id="list"></div>
</div>

<button class="fab" id="fab" aria-label="Add book">+</button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<script src="app.js" defer></script>
</body>
</html>
